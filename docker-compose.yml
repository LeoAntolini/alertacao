# Ambiente local do AlertAção: aplicação Django + banco PostgreSQL com PostGIS.
# Uso:  docker compose up
services:
  db:
    image: postgis/postgis:16-3.4
    # Mac com chip Apple (M1, M2, M3...): se der erro de arquitetura, descomente a linha abaixo.
    # platform: linux/amd64
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./app
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Comandos de manutenção contra o banco da nuvem (Neon). Precisa do arquivo .env.neon.
  # Exemplo:  docker compose run --rm web-neon python manage.py createsuperuser
  web-neon:
    build: ./app
    profiles: ["neon"]
    env_file:
      - path: .env.neon
        required: false
    volumes:
      - ./app:/app

volumes:
  pgdata:
