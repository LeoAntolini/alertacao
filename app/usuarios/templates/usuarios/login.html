{% extends "base.html" %}
{% block titulo %}Entrar · AlertAção{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">E-mail</label>
    {{ form.username }}
    {{ form.username.errors }}
    <label for="{{ form.password.id_for_label }}">Senha</label>
    {{ form.password }}
    {{ form.password.errors }}
    <button type="submit">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>.</p>
{% endblock %}
