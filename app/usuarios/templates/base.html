<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}AlertAção{% endblock %}</title>
  <style>
    :root { --azul: #1f4e9c; --borda: #c9d3e3; --erro: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f7fb; color: #1b2433; }
    header { background: var(--azul); color: #fff; padding: 12px 16px; font-weight: 700; }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 8px 0 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input[type=text], input[type=email], input[type=password], select { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--borda); border-radius: 8px; background: #fff; }
    button, .botao { display: inline-block; width: 100%; padding: 14px; margin-top: 14px; font-size: 1rem; font-weight: 700; color: #fff; background: var(--azul); border: 0; border-radius: 8px; text-align: center; text-decoration: none; cursor: pointer; }
    button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
    .erro, .errorlist { color: var(--erro); margin: 6px 0; padding-left: 0; list-style: none; font-size: .95rem; }
    .aviso { background: #fff6e5; border: 1px solid #e0a030; border-radius: 8px; padding: 10px; font-size: .9rem; margin: 12px 0; }
    .consentimento label { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; }
    #mapa { height: 280px; border-radius: 8px; border: 1px solid var(--borda); margin-top: 8px; }
    a { color: var(--azul); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>AlertAção</header>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
